name: Docker (ghcr.io)

on:
  push:
    branches: [main]
    tags: ["v*"]
  # External PRs only run after a maintainer adds the `ok-to-test` label
  # (or the author is already a repo collaborator). The gate job below
  # skips everything else before any code from the PR is executed.
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check approval for PR builds
        id: check
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          author='${{ github.event.pull_request.user.login }}'
          if gh api "repos/${{ github.repository }}/collaborators/${author}" --jq .permission >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"   # collaborator: always run
            exit 0
          fi
          if gh pr view "${{ github.event.pull_request.number }}" \
               --json labels --jq '.labels[].name' | grep -qx 'ok-to-test'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"   # maintainer-approved
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "⏳ External PRs need a maintainer to add the \`ok-to-test\` label before CI images are built." || true
          fi

  build:
    needs: gate
    if: github.event_name != 'pull_request_target' || needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request_target' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VERSION=${{ github.ref_name }}
          push: ${{ github.event_name != 'pull_request_target' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
