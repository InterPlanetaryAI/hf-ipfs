name: Docker CI (ghcr.io)

# Branch/PR images only. Versioned images (`X.Y.Z`, `latest`) are built by
# `release.yml` when release-please publishes a release.
#
# External PRs only run after a maintainer adds the `ok-to-test` label
# (or the author is already a repo collaborator). The gate job below
# skips everything else before any code from the PR is executed.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check approval for PR builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          author='${{ github.event.pull_request.user.login }}'
          if gh api "repos/${{ github.repository }}/collaborators/${author}" --jq .permission >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"   # collaborator: always run
            exit 0
          fi
          if gh pr view "${{ github.event.pull_request.number }}" \
               --json labels --jq '.labels[].name' | grep -qx 'ok-to-test'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"   # maintainer-approved
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body "⏳ External PRs need a maintainer to add the \`ok-to-test\` label before CI images are built." || true
          fi

  build:
    needs: gate
    if: always() && (github.event_name != 'pull_request_target' || needs.gate.outputs.ok == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # GHCR image names must be lowercase; the owning org is not.
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request_target'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request_target' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # PR builds only compile; pushing an untrusted image under a shared tag
          # is exactly what the gate exists to prevent.
          push: ${{ github.event_name != 'pull_request_target' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
