name: Release Assets
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ver="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=$ver" -o hf-ipfs .
          tar czf "hf-ipfs-$ver-$GOOS-$GOARCH.tar.gz" hf-ipfs
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" hf-ipfs-*.tar.gz
