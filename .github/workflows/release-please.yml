name: Release Please

# Pushes to main open/update a "chore(main): release X.Y.Z" PR. Merging that PR
# re-runs this workflow, which mints the tag and the GitHub release; `release.yml`
# then attaches binaries and pushes the versioned container images.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
